<!doctype html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--fond:#0b0a10;--carte:#17141f;--ligne:#2c2640;--texte:#f4f1ff;--doux:#b9aee6;--lav:#ff5a5f;--lav2:#ff8f92;--rouge:#ff7a8a;--vert:#7ee0b0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.45 Barlow,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--fond);border-bottom:1px solid var(--ligne);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font:700 22px/1.1 "Bricolage Grotesque",sans-serif;margin:0;flex:1;min-width:180px}
h1 small{display:block;font:500 13px Barlow,sans-serif;color:var(--doux);letter-spacing:.04em;text-transform:uppercase}
h2{font:700 20px "Bricolage Grotesque",sans-serif;margin:24px 0 10px}
nav button,.btn{font:600 15px Barlow,sans-serif;border:1px solid var(--lav);background:transparent;color:var(--lav2);border-radius:999px;padding:8px 14px;cursor:pointer}
nav button.on,.btn.plein{background:var(--lav);color:#0b0a10;border-color:var(--lav)}
.btn.petit{padding:4px 10px;font-size:13px}
a.btn{text-decoration:none;display:inline-block}
.btn.danger{border-color:var(--rouge);color:var(--rouge)}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:980px;margin:0 auto;padding:8px 16px 80px}
.liste{display:grid;gap:10px}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--carte);border:1px solid var(--ligne);border-radius:10px;padding:12px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.ev:hover{border-color:var(--lav)}
.jour{text-align:center;border-right:1px solid var(--ligne);padding-right:10px}
.jour b{display:block;font:700 26px/1 "Bricolage Grotesque",sans-serif}
.jour span{font-size:12px;text-transform:uppercase;color:var(--doux)}
.ev h3{margin:0 0 2px;font-size:17px}
.ev p{margin:0;color:var(--doux);font-size:14px}
.jauge{min-width:92px;text-align:right;font-size:14px}
.jauge .barre{height:5px;background:var(--ligne);border-radius:3px;margin-top:5px;overflow:hidden}
.jauge .barre i{display:block;height:100%;background:var(--lav)}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-left:6px;border:1px solid var(--ligne);color:var(--doux);vertical-align:2px}
.badge.Ouvert{border-color:var(--vert);color:var(--vert)}
.badge.Annulé{border-color:var(--rouge);color:var(--rouge)}
.statutRapide{width:auto;font-size:13px;padding:4px 6px;margin-top:6px;border-radius:999px}
.galerie{margin:14px 0 0}
.galerie h4{margin:12px 0 4px;font:600 14px Barlow,sans-serif;color:var(--doux)}
.galerie details{margin-top:10px}
.galerie summary{cursor:pointer;color:var(--lav2);font-weight:600;font-size:14px}
.photo .etiquette{position:absolute;right:6px;top:4px;font:600 11px Barlow,sans-serif;background:rgba(11,10,16,.8);color:var(--vert);border-radius:999px;padding:1px 7px}
.photo .etiquette.drive{color:var(--doux)}
.photo .outils{flex-wrap:wrap;gap:0 2px}
.photo.portrait img{object-fit:contain;background:#000}
.groupe{margin-top:18px}
.groupe h3{margin:0 0 6px;font:700 17px "Bricolage Grotesque",sans-serif}
.pin{max-width:360px;margin:40px auto;text-align:center}
.pin img{width:96px;height:96px;border-radius:22px}
.pin input{font:700 34px/1 "Bricolage Grotesque",sans-serif;text-align:center;letter-spacing:.3em;padding:14px 10px;margin:16px 0 12px}
.pin .btn{width:100%;padding:12px}
.compte{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--ligne)}
.compte:last-child{border:0}
.compte .qui{flex:1;min-width:200px}
.compte .qui b{font-size:16px}
.compte .qui p{margin:3px 0 0;color:var(--doux);font-size:13px}
.compte .actions{margin:0}
.coches label{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--texte);margin:6px 0;cursor:pointer}
.coches input{width:auto;margin-top:3px}
.bandeau{background:var(--carte);border:1px solid var(--lav);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.bandeau a{color:var(--lav2)}
nav button.discret{border-color:var(--ligne);color:var(--doux)}
.arrivee{width:auto;transform:scale(1.3);margin:4px}
tr.arrivee td{color:var(--vert)}
.vide{color:var(--doux);font-style:italic}
form .grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
form .grille>div{display:flex;flex-direction:column;justify-content:flex-end}form .grille>div label{margin-top:auto}form .grille>div .aide{margin-top:4px}
label{display:block;font-size:13px;color:var(--doux);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--texte);background:#100e17;border:1px solid var(--ligne);border-radius:8px;padding:9px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lav);border-color:var(--lav)}
textarea{min-height:110px;resize:vertical}
.large{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.panneau{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:16px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ligne);vertical-align:top}
th{color:var(--doux);font-weight:500}
tr.annulee td{opacity:.45;text-decoration:line-through}
tr.annulee td:last-child{text-decoration:none}
.tableau{overflow-x:auto}
.aide{font-size:13px;color:var(--doux);margin:4px 0 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--lav);color:#0b0a10;font-weight:600;padding:10px 16px;border-radius:999px;display:none;z-index:20;max-width:92vw}
#toast.erreur{background:var(--rouge)}
#charge{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--lav);display:none;z-index:30;animation:c 1s infinite linear}
@keyframes c{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
/* Photos et recadrage */
.photos{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 8px}
#photos .photo{width:180px}
.photo{position:relative;width:150px;aspect-ratio:3/2;background:#100e17;border:1px solid var(--ligne);border-radius:8px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .outils{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(11,10,16,.8);padding:3px 4px}
.photo .outils button,.photo .outils a{background:none;border:0;color:var(--texte);font:600 12px Barlow,sans-serif;cursor:pointer;padding:3px 5px;text-decoration:none}
.photo .outils button:hover,.photo .outils a:hover{color:var(--lav2)}
.photo .num{position:absolute;left:6px;top:4px;font:700 12px Barlow,sans-serif;background:var(--lav);color:#0b0a10;border-radius:999px;padding:1px 7px}
.photos .ajout{width:150px;aspect-ratio:3/2;border:1px dashed var(--lav);border-radius:8px;background:none;color:var(--lav2);font:600 14px Barlow,sans-serif;cursor:pointer}
#recadrage{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:none;align-items:center;justify-content:center;padding:12px}
#recadrage.ouvert{display:flex}
#recadrage .boite{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:16px;width:min(96vw,640px)}
#recadrage canvas{display:block;width:100%;aspect-ratio:3/2;background:#000;border-radius:8px;cursor:grab;touch-action:none}
#recadrage .reglage{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--doux)}
#recadrage input[type=range]{flex:1;padding:0}
/* Aperçu du site */
.apercu{margin-top:12px}
.apercu .onglets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
@media (max-width:560px){.ev{grid-template-columns:52px 48px 1fr}.mini,.vide-mini{width:48px;height:48px}.jauge{grid-column:2;text-align:left}.jauge .barre{width:120px}}
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tuile{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:14px}.tuile b{display:block;font:700 30px/1 "Bricolage Grotesque"}.tuile span{font-size:13px;color:var(--doux)}.tuile.chaud{border-color:var(--lav)}
.btn.ok{background:var(--vert);border-color:var(--vert);color:#0b0a10}
.afaire{margin:0;padding-left:18px}.afaire a{color:var(--lav2)}
.ev{grid-template-columns:64px 56px 1fr auto}.mini{width:56px;height:56px;object-fit:cover;border-radius:8px}.vide-mini{display:grid;place-items:center;width:56px;height:56px;border-radius:8px;background:var(--ligne);font-weight:700}
.barreEv{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.barreEv h2{flex:1;margin:0}
.editeur.avecApercu{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,44%);gap:16px}.voletApercu{position:sticky;top:70px;align-self:start}.voletApercu iframe{height:80vh}
.zones{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:14px}.photo.principale{width:260px}
h3.section{margin:14px 0 0;font:700 18px "Bricolage Grotesque"}
.barreTexte{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}.barreTexte button{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--ligne);background:var(--carte);color:var(--texte);cursor:pointer}
.coche{display:flex;gap:8px;align-items:center;color:var(--texte)}.coche input{width:auto}
.photo .legende{position:absolute;left:6px;bottom:30px;font-size:11px;background:rgba(11,10,16,.8);padding:1px 6px;border-radius:6px}
.groupe.aClasser h3{color:var(--lav2)}
.classer{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.classer img{width:180px;border-radius:8px}
tr.attente td{color:var(--doux)}
@media (max-width:960px){.editeur.avecApercu{display:block}.voletApercu{position:static}.voletApercu iframe{height:60vh}}
/* Boîte de dialogue interne (remplace les fenêtres du navigateur) */
#dialogue{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;display:none;align-items:center;justify-content:center;padding:16px}
#dialogue.ouvert{display:flex}
#dialogue .boite{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:18px;width:min(94vw,440px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#dialogue h3{margin:0 0 8px;font:700 18px "Bricolage Grotesque"}
#dialogue p{margin:0 0 10px;color:var(--doux);white-space:pre-line}
#dialogue .actions{justify-content:flex-end;margin-top:14px}
/* Barre de tri et de filtre des événements */
.barreTri{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.barreTri select,.barreTri input{width:auto;min-width:150px;padding:7px 10px;font-size:14px}
.barreTri input{flex:1;min-width:160px}
.barreTri .compte{font-size:13px;color:var(--doux);margin-left:auto}
/* Éditeur de texte mis en forme */
.editeurTexte{min-height:110px;background:#100e17;border:1px solid var(--ligne);border-radius:8px;padding:9px 12px;line-height:1.5;outline:none}
.editeurTexte:focus{border-color:var(--lav)}
.editeurTexte:empty:before{content:attr(data-vide);color:var(--doux)}
.editeurTexte p{margin:0 0 .7em}.editeurTexte p:last-child{margin-bottom:0}
.editeurTexte h3{margin:.4em 0 .4em;font:700 17px "Bricolage Grotesque"}
.editeurTexte blockquote{margin:.4em 0;padding:2px 12px;border-left:3px solid var(--lav);color:var(--doux);font-style:italic}
.editeurTexte ul{margin:.3em 0;padding-left:22px}
.barreTexte button.on{background:var(--lav);color:#0b0a10;border-color:var(--lav)}
/* Aperçu : vrai rendu ordinateur, mis à l'échelle, ou largeur téléphone */
.apercu .cadre{overflow:hidden;height:min(78vh,900px);border:1px solid var(--ligne);border-radius:12px;background:#120f24}
.apercu iframe{display:block;width:1200px;height:900px;border:0;border-radius:0;transform-origin:0 0;background:#120f24}
.apercu.tel .cadre{display:flex;justify-content:center;background:#0b0a10}
.apercu.tel iframe{width:390px;height:100%;max-width:100%;margin:0;transform:none}
.aide.alerte{color:var(--jaune,#ffd23f)}
/* Vignette « envoi en cours » */
.photo.envoi{display:grid;place-items:center;color:var(--doux);font-size:13px;border-style:dashed}
.photo.envoi i{display:block;width:22px;height:22px;border:3px solid var(--ligne);border-top-color:var(--lav);border-radius:50%;animation:tourne .8s linear infinite;margin:0 auto 6px}
@keyframes tourne{to{transform:rotate(360deg)}}
/* Réglages : e-mails avec variables à insérer et aperçu en direct */
.ongletsMail{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.ongletsMail button{background:var(--carte);border:1px solid var(--ligne);color:var(--texte);border-radius:999px;padding:7px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
.ongletsMail button.on{background:var(--lav);border-color:var(--lav);color:#0b0a10}
.editeurMail{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,46%);gap:16px;align-items:start}
.editeurMail textarea{min-height:220px;font-size:15px}
.puces{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
.puces span{font-size:12px;color:var(--doux);align-self:center;margin-right:4px}
.puces button{font:600 12px Barlow,sans-serif;background:var(--carte);border:1px dashed var(--lav);color:var(--lav2);border-radius:999px;padding:3px 9px;cursor:pointer}
.puces button:hover{background:var(--lav);color:#0b0a10}
.apercuMail{border:1px solid var(--ligne);border-radius:12px;overflow:hidden;position:sticky;top:70px}
.apercuMail .entete{padding:10px 14px;background:var(--carte);border-bottom:1px solid var(--ligne);font-size:13px;color:var(--doux);line-height:1.5}
.apercuMail .entete b{color:var(--texte)}
.apercuMail .corps{background:#fff;color:#1b1733;padding:18px;max-height:70vh;overflow:auto}
.apercuMail .corps a{color:#c81f74}
.apercuMail .corps.nu{padding:0;background:transparent}
.quandMail{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:10px 14px;border:1px dashed var(--ligne);border-radius:10px;font-size:14px;color:var(--doux)}
.quandMail .badge{flex:none;margin-top:2px}
.optionsMail{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;margin:14px 0 4px;padding:12px 14px;background:var(--carte);border-radius:10px}
.optionsMail label{font-size:13px;color:var(--doux)}.optionsMail label input:not([type=checkbox]),.optionsMail label select{margin-top:4px}
.optionsMail .coche{font-size:14px;color:var(--texte);align-self:end;min-height:38px}
.choixEx{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--carte);border-bottom:1px solid var(--ligne);font-size:13px;color:var(--doux)}
.choixEx select{width:auto;flex:1;min-width:0;padding:5px 8px;font-size:13px}
#dlgTexte select{width:100%;margin-top:10px}
@media (max-width:960px){.editeurMail{display:block}.apercuMail{position:static;margin-top:14px}}
</style>
</head>
<body>
<div id="charge"></div>
<header>
  <h1><small id="nomFestival">Festival</small>Réservations</h1>
  <nav><button data-vue="accueil" class="on">Accueil</button> <button data-vue="evenements">Événements</button> <button data-vue="photos" data-droit="photos">Visuels</button> <button data-vue="mails" data-droit="reglages">E-mails</button> <button data-vue="reglages" data-droit="reglages,comptes">Réglages</button> <button type="button" class="discret" id="quitter" title="Changer de compte">Quitter</button></nav>

<input type="file" id="fichiersGalerie" accept="image/*" multiple hidden>

<div id="dialogue" role="dialog" aria-modal="true"><div class="boite"><h3 id="dlgTitre"></h3><p id="dlgTexte"></p><input id="dlgChamp" hidden><div class="actions"><button type="button" class="btn" id="dlgNon">Annuler</button><button type="button" class="btn plein" id="dlgOui">OK</button></div></div></div>

<script>

function normTitre(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
var TITRES_SUPP = [];
function titresConnus() { var l = titresConnusBase(); TITRES_SUPP.forEach(function (t) { if (!l.some(function (x) { return normTitre(x) === normTitre(t); })) l.push(t); }); return l; }
function titresConnusBase() {
  var l = Object.keys(window.SPECTACLES || {}); (D.spectacles || []).forEach(function (s) { if (!l.some(function (k) { return normTitre(k) === normTitre(s); })) l.push(s); });
  D.evenements.forEach(function (e) { var s = e.spectacle || e.titre; if (s && !l.some(function (k) { return normTitre(k) === normTitre(s); })) l.push(s); });
  return l.sort(function (a, b) { return a.localeCompare(b, 'fr'); });
}
function titreDe(nom) { // « Titre · 3 » ou « Titre 3 » → titre connu
  var n = normTitre(String(nom).split(' · ')[0]), l = titresConnus().slice().sort(function (a, b) { return b.length - a.length; });
  for (var i = 0; i < l.length; i++) { var k = normTitre(l[i]); if (n === k || n.indexOf(k + ' ') === 0) return l[i]; }
  return '';
}
function idDrive(u) { var m = /drive\.google\.com\/(?:thumbnail\?id=|uc\?id=|file\/d\/)([\w-]+)/.exec(u || ''); return m ? m[1] : ''; }

function toutesPhotos() {
  var l = [], SP = window.SPECTACLES || {}, utilisees = {};
  D.evenements.forEach(function (e) { String(e.image || '').split(/\s*[\n,]\s*/).forEach(function (u) { if (u) utilisees[u.split('/').pop()] = true; }); });
  function infos(p) { var v = INFOS_VISUELS[cleVisuel(p)]; if (v) { if (v.spectacle) p.titre = v.spectacle; if (v.credit) p.credit = v.credit; p.legende = v.legende || ''; } return p; }
  Object.keys(SP).forEach(function (k) {
    var s = SP[k], aff = (s.photos || (s.photo ? [{ src: s.photo, credit: s.credit }] : []));
    aff.forEach(function (p) { l.push(infos({ titre: k, url: siteUrl() + p.src, credit: p.credit || '', origine: 'site', surSite: true })); });
    (s.banque || []).forEach(function (p) { l.push(infos({ titre: k, url: siteUrl() + p.src, credit: p.credit || '', origine: 'site', surSite: false })); });
  });
  (PHOTOS_DRIVE || []).forEach(function (f) { l.push(infos({ titre: f.spectacle || titreDe(f.nom), nom: f.nom, url: f.url, credit: f.credit || '', legende: f.legende || '', origine: 'drive', id: f.id, surSite: !!utilisees[f.url.split('/').pop()] })); });
  return l;
}
function cartePhoto(p, boutons) {
  return '<div class="photo" title="' + esc([p.legende, p.credit].filter(Boolean).join(' · ') || p.nom || '') + '"><img src="' + esc(p.url) + '" alt="" loading="lazy">' +
    (p.surSite ? '<span class="etiquette">Sur le site</span>' : '') + (p.legende ? '<span class="legende">' + esc(p.legende) + '</span>' : '') +
    '<div class="outils">' + boutons + '</div></div>';
}
function galerieAfficher() {
  var z = $('#galerie'); if (!z) return;
  chargerSite(function () { chargerDrive(function () {
    var cible = normTitre($('#f-spectacle').value || $('#f-titre').value), prises = listePhotos();
    var toutes = toutesPhotos(), pour = toutes.filter(function (p) { return normTitre(p.titre) === cible; }), autres = toutes.filter(function (p) { return normTitre(p.titre) !== cible; });
    function boutons(p) {
      var deja = prises.some(function (u) { return u === p.url || u.split('/').pop() === p.url.split('/').pop(); });
      return (deja ? '<span style="color:var(--vert);font-size:12px;padding:3px 5px">✓ Utilisé</span>' : '<button type="button" data-utiliser="' + esc(p.url) + '">+ Utiliser</button>') +
        '<button type="button" data-recadrer-g="' + esc(p.url) + '">Recadrer</button>';
    }
    var h = '<h4>Visuels disponibles pour « ' + esc($('#f-spectacle').value || $('#f-titre').value) + ' » (' + pour.length + ')</h4>';
    h += pour.length ? '<div class="photos">' + pour.map(function (p) { return cartePhoto(p, boutons(p)); }).join('') + '</div>'
      : '<p class="aide">Aucun visuel classé sous ce titre. Ajoutez-en dans l\'onglet Visuels (ou classez-y ceux qui existent).</p>';
    var groupes = {}; autres.forEach(function (p) { (groupes[p.titre || 'À classer'] = groupes[p.titre || 'À classer'] || []).push(p); });
    h += '<details><summary>Les visuels des autres spectacles (' + autres.length + ')</summary>' + Object.keys(groupes).sort().map(function (k) {
      return '<h4>' + esc(k) + '</h4><div class="photos">' + groupes[k].map(function (p) { return cartePhoto(p, boutons(p)); }).join('') + '</div>';
    }).join('') + '</details>';
    z.innerHTML = h;
    z.querySelectorAll('[data-utiliser]').forEach(function (b) { b.onclick = function () { ecrirePhotos(listePhotos().concat([b.dataset.utiliser])); }; });
    z.querySelectorAll('[data-recadrer-g]').forEach(function (b) { b.onclick = function () {
      recadrerUrl(b.dataset.recadrerG, ($('#f-titre').value || 'photo'), function (url) { ecrirePhotos(listePhotos().concat([url])); toast('Visuel recadré et ajouté : pensez à enregistrer'); });

function photosInit() {
  if (!$('#photos')) return;
  photosAfficher(); galerieAfficher();
  $('#f-titre').addEventListener('change', galerieAfficher); $('#f-spectacle').addEventListener('change', galerieAfficher);
  $('#urlPhoto').onclick = function () { demander('Adresse de l\'image (https://…) :', function (u) { if (/^https?:\/\//.test(u)) ecrirePhotos(listePhotos().concat([u])); else toast('Adresse invalide', true); }, { placeholder: 'https://…' }); };

    var fichiers = Array.prototype.slice.call(this.files), titre = ($('#f-spectacle').value || $('#f-titre').value || 'photo'); if (!fichiers.length) return;
    if (fichiers.length === 1) return recadrer(fichiers[0], function (base64) {

    });

    var n = 0; toast('Envoi de ' + fichiers.length + ' visuels…');
    (function suivant() {

      reduire(fichiers[n++], function (base64) { envoyerImage(titre, base64, function (r) { ecrirePhotos(listePhotos().concat([r.url])); suivant(); }); });

var ENVOIS = 0;
function vignetteEnvoi() { var zg = $('#photos'); if (!zg) return; zg.querySelectorAll('.photo.envoi').forEach(function (x) { x.remove(); }); for (var i = 0; i < ENVOIS; i++) zg.insertAdjacentHTML('beforeend', '<div class="photo envoi"><div><i></i>Envoi…</div></div>'); }
function envoyerImage(titre, base64, ok, extra) {
  toast('Envoi du visuel…'); ENVOIS++; vignetteEnvoi();
  var d = { nom: titre + ' · ' + new Date().toISOString().slice(0, 16).replace('T', ' '), base64: base64, spectacle: titre };
  if (extra) Object.keys(extra).forEach(function (k) { d[k] = extra[k]; });
  appel('adminEnregistrerImage', [d], function (r) { ENVOIS = Math.max(0, ENVOIS - 1); PHOTOS_DRIVE = null; ok(r); vignetteEnvoi(); });
}
// Récupère un visuel existant (site ou Drive) pour le recadrer, puis l'enregistre comme nouveau fichier.
function recadrerUrl(url, titre, ok) {
  var id = idDrive(url);
  function suite(blob) { recadrer(blob, function (base64) { envoyerImage(titre, base64, function (r) { ok(r.url); }); }); }
  function rate() { toast('Impossible de lire ce visuel pour le recadrer.', true); }
  if (id) appel('adminLireImage', [id], function (r) { fetch(r.base64).then(function (x) { return x.blob(); }).then(suite).catch(rate); });
  else fetch(url, { mode: 'cors' }).then(function (x) { if (!x.ok) throw 0; return x.blob(); }).then(suite).catch(rate);
}
// Réduit un visuel (max 1600 px) sans le recadrer, pour la bibliothèque.
function reduire(fichier, ok) {
  var charge = window.createImageBitmap ? createImageBitmap(fichier, { imageOrientation: 'from-image' }) : Promise.reject();
  charge.catch(function () { return new Promise(function (res, rej) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = rej; i.src = URL.createObjectURL(fichier); }); })
    .then(function (im) {
      var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', 0.85));
    }).catch(function () { toast('Visuel illisible : ' + fichier.name, true); });
}

// ---------- Recadrage : cadre 3:2 du site, repères pour les autres emplacements, zoom, rotation ----------
function recadrer(fichier, ok) {
  var boite = $('#recadrage'), cv = $('#cv'), ctx = cv.getContext('2d'), zoom = $('#zoom'), reperes = $('#reperes');
  var img, base, s, ox, oy, W = 900, H = 600, rotation = 0;
  cv.width = W; cv.height = H;
  var charge = window.createImageBitmap ? createImageBitmap(fichier, { imageOrientation: 'from-image' }).catch(function () { return chargerImage(fichier); }) : chargerImage(fichier);
  charge.then(function (im) { img = im; recentrer(); boite.classList.add('ouvert'); });
  function chargerImage(f) { return new Promise(function (res, rej) { var u = URL.createObjectURL(f), i = new Image(); i.onload = function () { res(i); }; i.onerror = rej; i.src = u; }); }
  function recentrer() { base = Math.max(W / img.width, H / img.height); s = base; zoom.value = 1; ox = (W - img.width * s) / 2; oy = (H - img.height * s) / 2; dessiner(); }
  function tourner() { // 90° : on redessine l'image dans un canevas pivoté, puis on recentre
    var c = document.createElement('canvas'); c.width = img.height; c.height = img.width;
    var x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(Math.PI / 2); x.drawImage(img, -img.width / 2, -img.height / 2);
    img = c; recentrer();
  }
  function borner() { ox = Math.min(0, Math.max(W - img.width * s, ox)); oy = Math.min(0, Math.max(H - img.height * s, oy)); }
  function dessiner() {
    borner(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.drawImage(img, ox, oy, img.width * s, img.height * s);
    if (!reperes.checked) return;
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.setLineDash([10, 8]); ctx.lineWidth = 2;
    ctx.strokeRect(1, H * 0.125, W - 2, H * 0.75); // haut de fiche (2:1), bande centrale
    ctx.strokeRect((W - H) / 2, 1, H, H - 2); // miniature carrée (liste)
    ctx.restore();
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.font = '600 15px Barlow, sans-serif';
    ctx.fillRect(8, 8, 150, 22); ctx.fillStyle = '#fff'; ctx.fillText('Cadre : programme', 14, 24);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(8, H * 0.125 + 8, 160, 22); ctx.fillStyle = '#fff'; ctx.fillText('— — haut de fiche', 14, H * 0.125 + 24);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect((W - H) / 2 + 8, H - 30, 110, 22); ctx.fillStyle = '#fff'; ctx.fillText('— — miniature', (W - H) / 2 + 14, H - 14);
    ctx.restore();
  }
  zoom.oninput = function () { var ns = base * zoom.value, cx = W / 2, cy = H / 2; ox = cx - (cx - ox) * ns / s; oy = cy - (cy - oy) * ns / s; s = ns; dessiner(); };
  reperes.onchange = dessiner;
  $('#tourner').onclick = tourner; $('#recentrer').onclick = recentrer;
  var doigts = {}, pince = null;
  cv.onpointerdown = function (ev) { doigts[ev.pointerId] = { x: ev.clientX, y: ev.clientY }; cv.setPointerCapture(ev.pointerId); var l = Object.keys(doigts); if (l.length === 1) pince = { x: ev.clientX, y: ev.clientY, ox: ox, oy: oy }; else pince = null; };
  cv.onpointermove = function (ev) {
    if (!doigts[ev.pointerId]) return;
    var avant = doigts[ev.pointerId]; doigts[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    var l = Object.keys(doigts), k = W / cv.clientWidth;
    if (l.length >= 2) { // pincement : zoom
      var a = doigts[l[0]], b = doigts[l[1]], autre = l[0] === String(ev.pointerId) ? b : a, dAvant = Math.hypot(avant.x - autre.x, avant.y - autre.y), dApres = Math.hypot(ev.clientX - autre.x, ev.clientY - autre.y);
      if (dAvant > 0) { var z = Math.min(4, Math.max(1, zoom.value * dApres / dAvant)); zoom.value = z; zoom.oninput(); }
    } else if (pince) { ox = pince.ox + (ev.clientX - pince.x) * k; oy = pince.oy + (ev.clientY - pince.y) * k; dessiner(); }
  };
  cv.onpointerup = cv.onpointercancel = function (ev) { delete doigts[ev.pointerId]; pince = null; };
  $('#recadrerOk').onclick = function () {
    var out = document.createElement('canvas'), f = 1600 / W; out.width = 1600; out.height = 1067;
    var c = out.getContext('2d'); c.fillStyle = '#000'; c.fillRect(0, 0, out.width, out.height); c.drawImage(img, ox * f, oy * f, img.width * s * f, img.height * s * f);
    boite.classList.remove('ouvert'); ok(out.toDataURL('image/jpeg', 0.85));
  };
  $('#recadrerNon').onclick = function () { boite.classList.remove('ouvert'); };
}

  return o;
}
function envoyerBrouillon(e, nouveau) {
  var f = $('#cadreSite'); if (!f || $('#voletApercu').hidden) return;
  clearTimeout(ENVOI_BROUILLON);
  ENVOI_BROUILLON = setTimeout(function () {
    var b = brouillonActuel(e, nouveau); if (!b || !f.contentWindow) return;
    var aide = $('#aideApercu');
    if (aide) { if (!b.date) { aide.textContent = 'Donnez une date à l\'événement : sans date, il n\'apparaît ni dans l\'aperçu ni sur le site.'; aide.className = 'aide alerte'; } else if (aide.className === 'aide alerte') { aide.textContent = 'L\'aperçu suit ce que vous tapez, même avant d\'enregistrer.'; aide.className = 'aide'; } }
    if (!b.date) return;
    try { f.contentWindow.postMessage({ type: 'pf-brouillon', evenement: b }, '*'); } catch (err) {}
  }, 350);
}
function apercuInit(e, nouveau) {
  var a = $('#apercu'), volet = $('#voletApercu'), bouton = $('#voirApercu'); if (!a || !bouton) return;
  var cadre = $('#cadreSite'), editeur = $('#editeur'), boiteCadre = a.querySelector('.cadre');
  function pageDe(b) { return b.dataset.jour ? b.dataset.page + ($('#f-date') && $('#f-date').value || aujourdhui()) : b.dataset.page; }
  function charger(page) { cadre.src = 'about:blank'; setTimeout(function () { cadre.src = siteUrl() + page; }, 30); }
  function ajuster() { // rendu « ordinateur » (1200 px de large) réduit pour tenir dans le volet ; « téléphone » = 390 px sans réduction
    if (a.classList.contains('tel')) { cadre.style.transform = ''; cadre.style.width = ''; cadre.style.height = ''; return; }
    var w = boiteCadre.clientWidth, h = boiteCadre.clientHeight, k = Math.min(1, w / 1200);
    cadre.style.width = '1200px'; cadre.style.transform = 'scale(' + k + ')'; cadre.style.height = Math.round(h / k) + 'px';
  }
  if (window.ResizeObserver) new ResizeObserver(ajuster).observe(boiteCadre); else addEventListener('resize', ajuster);
  cadre.onload = function () { if (cadre.src !== 'about:blank') setTimeout(function () { envoyerBrouillon(e, nouveau); }, 400); };
  function ouvrir() { volet.hidden = false; editeur.classList.add('avecApercu'); bouton.classList.add('on'); garderLocal('apercu', '1'); ajuster(); if (!cadre.src || cadre.src === 'about:blank') charger(pageDe(a.querySelector('[data-page].on'))); }
  function fermer() { volet.hidden = true; editeur.classList.remove('avecApercu'); bouton.classList.remove('on'); garderLocal('apercu', ''); }
  bouton.onclick = function () { volet.hidden ? ouvrir() : fermer(); };
  $('#fermerApercu').onclick = fermer;
  a.querySelectorAll('[data-page]').forEach(function (b) {
    b.onclick = function () {
      a.querySelectorAll('[data-page]').forEach(function (x) { x.classList.toggle('on', x === b); });
      $('#ouvrirSite').href = siteUrl() + pageDe(b).replace('?frais=1', '');
      charger(pageDe(b));
    };
  });
  $('#tel').onclick = function () { a.classList.toggle('tel'); $('#tel').classList.toggle('on'); ajuster(); };
  if (lireLocal('apercu') === '1' && window.innerWidth > 960) ouvrir();
}

appel('adminCharger', [], recharger);
</script>
